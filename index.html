/* =======================================================
   8d. Evaluasi: mana yang benar-benar menghasilkan
   ======================================================= */
let ev = {bulan:12, lingkup:'semua', per:'jenis'};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function labaKerja(k){ return nilaiKerja(k) - num(k.biaya); }
function menitKerja(k){ return totalMenit(k); }
function tglAcuan(k){ return k.selesaiTgl || k.tenggat || k.mulai || ''; }

function kerjaTerevaluasi(){
  const batas = ev.bulan>=999 ? '0000-00-00' : addDays(today(), -Math.round(ev.bulan*30.4));
  return S.pekerjaan.filter(k=>{
    if(k.status==='batal'||k.status==='prospek') return false;
    if(ev.lingkup==='selesai' && k.status!=='selesai') return false;
    const t=tglAcuan(k);
    if(t && t<batas) return false;
    return menitKerja(k)>0;
  });
}
function ringkas(list){
  const menit=list.reduce((a,k)=>a+menitKerja(k),0);
  const nilai=list.reduce((a,k)=>a+nilaiKerja(k),0);
  const biaya=list.reduce((a,k)=>a+num(k.biaya),0);
  const laba=nilai-biaya;
  const jam=jamDesimal(menit);
  const revisi=list.reduce((a,k)=>a+(k.revisi||[]).length,0);
  const selesai=list.filter(k=>k.status==='selesai'&&k.selesaiTgl);
  const tepat=selesai.filter(k=>!k.tenggat||k.selesaiTgl<=k.tenggat).length;
  const estimasi=list.filter(k=>num(k.estimasiJam)>0);
  const meleset = estimasi.length
    ? estimasi.reduce((a,k)=>a+(jamDesimal(menitKerja(k))/num(k.estimasiJam)),0)/estimasi.length : null;
  return {
    n:list.length, menit, jam, nilai, biaya, laba,
    perJam: jam>0 ? laba/jam : 0,
    revisiRata: list.length? revisi/list.length : 0,
    tepatPersen: selesai.length? tepat/selesai.length*100 : null,
    melesetRasio: meleset, nSelesai:selesai.length
  };
}
function kelompok(list, kunci){
  const peta={};
  list.forEach(k=>{ const g=kunci(k)||'—'; (peta[g]=peta[g]||[]).push(k); });
  return Object.keys(peta).map(g=>Object.assign({label:g, list:peta[g]}, ringkas(peta[g])));
}
function perJamPeriode(list,dari,sampai){
  let menit=0, laba=0;
  list.forEach(k=>{
    const m=(k.sesi||[]).filter(s=>s.tgl>=dari&&s.tgl<=sampai).reduce((a,s)=>a+num(s.menit),0);
    if(!m) return;
    const bagi = menitKerja(k)? m/menitKerja(k) : 0;
    menit+=m; laba+=labaKerja(k)*bagi;
  });
  return jamDesimal(menit)>0 ? laba/jamDesimal(menit) : null;
}
function skorPotensi(g, ctx){
  /* 1. hasil per jam dibanding tarif acuan Anda (35) */
  const acuan = ctx.acuan||1;
  const hasil = clamp(g.perJam/acuan, 0, 2)/2*35;
  /* 2. permintaan: banyaknya pekerjaan dibanding jenis tersibuk (25) */
  const minat = clamp(g.n/(ctx.maxN||1), 0, 1)*25;
  /* 3. kelancaran: sedikit revisi & tepat waktu (20) */
  const revSkor = clamp(1-(g.revisiRata/3), 0, 1)*10;
  const tepatSkor = g.tepatPersen===null ? 5 : g.tepatPersen/100*10;
  /* 4. arah: tarif efektif 3 bulan terakhir vs sebelumnya (20) */
  const baru=perJamPeriode(g.list, addDays(today(),-90), today());
  const lama=perJamPeriode(g.list, addDays(today(),-270), addDays(today(),-91));
  let arah=10, arahTeks='Data belum cukup untuk melihat arah';
  if(baru!==null && lama!==null && lama>0){
    const r=baru/lama;
    arah=clamp((r-0.6)/0.8,0,1)*20;
    arahTeks = r>=1.05? 'Naik '+Math.round((r-1)*100)+'% dari periode sebelumnya'
      : r<=0.95? 'Turun '+Math.round((1-r)*100)+'% dari periode sebelumnya' : 'Stabil';
  }
  const total=Math.round(hasil+minat+revSkor+tepatSkor+arah);
  return {
    total: clamp(total,0,100),
    rincian:[
      ['Hasil per jam', Math.round(hasil), 35],
      ['Permintaan', Math.round(minat), 25],
      ['Kelancaran', Math.round(revSkor+tepatSkor), 20],
      ['Arah', Math.round(arah), 20]
    ],
    arahTeks,
    yakin: (g.n>=3 || (g.n>=2 && g.jam>=20)) ? 'cukup' : 'tipis'
  };
}
function temuan(list, jenis, klien, rk, saluran){
  const t=[];
  const acuan=num(S.profil.tarifJam);
  const layak=jenis.filter(g=>g.jam>=3).sort((a,b)=>b.perJam-a.perJam);
  if(layak.length>=2){
    const a=layak[0], b=layak[layak.length-1];
    if(b.perJam>0 && a.perJam/b.perJam>=1.25){
      t.push({ikon:'up',teks:`<strong>${esc(a.label)}</strong> paling menghasilkan: ${fmtRp(a.perJam)} per jam, ${fmtNum(Math.round(a.perJam/b.perJam*10)/10)}× lipat ${esc(b.label)} yang hanya ${fmtRp(b.perJam)} per jam.`});
    }
  }
  {
    const rendah=layak.filter(g=>tarifAcuanJenis(g.label)>0 && g.perJam<tarifAcuanJenis(g.label)*0.8);
    if(rendah.length) t.push({ikon:'warn',teks:`${rendah.map(g=>'<strong>'+esc(g.label)+'</strong> ('+fmtRp(g.perJam)+' dari acuan '+fmtRp(tarifAcuanJenis(g.label))+')').join(', ')} menghasilkan di bawah tarif acuannya per jam. Entah harganya perlu naik, atau jamnya yang perlu ditekan.`});
  }
  jenis.filter(g=>g.melesetRasio!==null&&g.n>=2&&g.melesetRasio>=1.2).sort((a,b)=>b.melesetRasio-a.melesetRasio).slice(0,1).forEach(g=>{
    t.push({ikon:'warn',teks:`Perkiraan jam untuk <strong>${esc(g.label)}</strong> meleset rata-rata ${Math.round((g.melesetRasio-1)*100)}% lebih lama. Tambahkan selisih itu waktu menghargai.`});
  });
  jenis.filter(g=>g.n>=2&&g.revisiRata>=1.5).sort((a,b)=>b.revisiRata-a.revisiRata).slice(0,1).forEach(g=>{
    t.push({ikon:'warn',teks:`<strong>${esc(g.label)}</strong> paling banyak revisi: rata-rata ${fmtNum(Math.round(g.revisiRata*10)/10)}× per pekerjaan. Jatah revisi untuk jenis ini sebaiknya dibatasi lebih ketat.`});
  });
  const klienBaik=klien.filter(g=>g.jam>=5&&g.n>=2).sort((a,b)=>b.perJam-a.perJam)[0];
  if(klienBaik && klien.length>=2) t.push({ikon:'up',teks:`Klien paling menguntungkan: <strong>${esc(klienBaik.label)}</strong>, ${fmtRp(klienBaik.perJam)} per jam dari ${klienBaik.n} pekerjaan.`});
  if(rk.length){
    const lambat=rk.filter(r=>r.hari!==null).sort((a,b)=>b.hari-a.hari)[0];
    if(lambat && lambat.hari>21) t.push({ikon:'warn',teks:`<strong>${esc(lambat.nama)}</strong> rata-rata melunasi ${lambat.hari} hari setelah pekerjaan selesai. Pertimbangkan DP lebih besar di depan.`});
  }
  if(saluran && saluran.length>=2){
    const s=saluran.filter(g=>g.n>=2);
    if(s.length>=2){
      const a=s[0], b=s[s.length-1];
      if(b.perJam>0 && a.perJam/b.perJam>=1.3)
        t.push({ikon:'up',teks:`Klien dari <strong>${esc(a.label)}</strong> paling menguntungkan: ${fmtRp(a.perJam)} per jam, sementara dari ${esc(b.label)} ${fmtRp(b.perJam)} per jam. Saluran pertama layak dirawat lebih serius.`});
    }
  }
  const tanpaAsal=S.klien.filter(c=>!c.asal).length;
  if(tanpaAsal) t.push({ikon:'info',teks:`${tanpaAsal} klien belum dicatat asalnya, jadi belum terhitung di peringkat saluran.`});
  const tunggak=S.pekerjaan.filter(k=>k.status!=='batal'&&k.status!=='prospek')
    .reduce((a,k)=>a+Math.max(0,nilaiKerja(k)-dibayarKerja(k)),0);
  if(tunggak>0) t.push({ikon:'info',teks:`${fmtRp(tunggak)} belum tertagih dari seluruh pekerjaan berjalan dan selesai.`});
  const tanpaJam=S.pekerjaan.filter(k=>k.status!=='batal'&&k.status!=='prospek'&&menitKerja(k)===0).length;
  if(tanpaJam) t.push({ikon:'info',teks:`${tanpaJam} pekerjaan belum punya catatan jam, jadi tidak bisa ikut dihitung. Tarif per jam baru jujur kalau jamnya dicatat.`});
  return t;
}
function lagiBayar(){
  const peta={};
  S.pekerjaan.forEach(k=>{
    if(!k.selesaiTgl || !(k.pembayaran||[]).length) return;
    const kl=klienOf(k); if(!kl) return;
    const akhir=k.pembayaran.map(p=>p.tgl).sort().slice(-1)[0];
    const hari=Math.round((new Date(akhir+'T00:00:00')-new Date(k.selesaiTgl+'T00:00:00'))/86400000);
    if(isNaN(hari)) return;
    (peta[kl.nama]=peta[kl.nama]||[]).push(Math.max(0,hari));
  });
  return Object.keys(peta).map(n=>({nama:n, hari: Math.round(peta[n].reduce((a,b)=>a+b,0)/peta[n].length), n:peta[n].length}));
}

function viewEvaluasi(v){
  const list=kerjaTerevaluasi();
  const semua=ringkas(list);
  const acuan=num(S.profil.tarifJam)||semua.perJam||1;
  const jenis=kelompok(list,k=>k.jenis||LAINNYA).map(g=>Object.assign(g,{acuan:tarifAcuanJenis(g.label), sub:bidangJenis(g.label)})).sort((a,b)=>b.perJam-a.perJam);
  const bidangG=kelompok(list,k=>bidangJenis(k.jenis||LAINNYA)).map(g=>{
    const nm=[]; g.list.forEach(k=>{ const n=k.jenis||LAINNYA; if(nm.indexOf(n)<0) nm.push(n); });
    return Object.assign(g,{acuan:tarifAcuanBidang(g.label), sub:nm.join(', ')});
  }).sort((a,b)=>b.perJam-a.perJam);
  const perBidang = ev.per==='bidang' && !JC().datar;
  const peringkat = perBidang ? bidangG : jenis;
  const klien=kelompok(list,k=>{const c=klienOf(k);return c?c.nama:'Tanpa klien';}).sort((a,b)=>b.perJam-a.perJam);
  const maxN=Math.max.apply(null,peringkat.map(g=>g.n).concat([1]));
  const ctx={acuan,maxN};
  const rk=lagiBayar();
  const saluran=kelompok(list.filter(k=>{const c=klienOf(k);return c&&c.asal;}), k=>klienOf(k).asal)
    .map(g=>{
      const nm=[];
      g.list.forEach(k=>{const c=klienOf(k); if(c&&nm.indexOf(c.nama)<0) nm.push(c.nama);});
      return Object.assign(g,{klien:nm.length, namaKlien:nm});
    }).sort((a,b)=>b.perJam-a.perJam);
  const hasil=temuan(list,jenis,klien,rk,saluran);

  head('Evaluasi','Mana yang benar-benar menghasilkan, bukan sekadar ramai',
    `<div class="seg">${[[3,'3 bln'],[6,'6 bln'],[12,'12 bln'],[999,'Semua']].map(b=>
      `<button data-act="evBulan" data-v="${b[0]}" class="${ev.bulan===b[0]?'on':''}">${b[1]}</button>`).join('')}</div>
     <div class="seg">${[['semua','Semua'],['selesai','Yang selesai']].map(s=>
      `<button data-act="evLingkup" data-v="${s[0]}" class="${ev.lingkup===s[0]?'on':''}">${s[1]}</button>`).join('')}</div>`);

  if(!list.length){
    v.innerHTML=`<div class="card">${emptyBox('Belum cukup data untuk dievaluasi',
      'Evaluasi dihitung dari jam kerja, nilai, dan biaya tiap pekerjaan. Begitu ada pekerjaan dengan jam tercatat, halaman ini akan terisi sendiri.',
      `<a class="btn btn-pri" href="#pekerjaan">Buka daftar pekerjaan</a>`)}</div>`;
    return;
  }

  const baris=(g,i)=>{
    const sk=skorPotensi(g,Object.assign({},ctx,{acuan:g.acuan||ctx.acuan}));
    return `<tr>
      <td>
        <div style="font-weight:600">${esc(g.label)}</div>

        <div style="font-size:11.5px;color:var(--muted);margin-top:2px">${g.n} pekerjaan · ${fmtJam(g.menit)} · acuan ${fmtRp(g.acuan||ctx.acuan)}/jam${sk.yakin==='tipis'?' · <span style="color:var(--amber)">data tipis</span>':''}</div>

            color:${f.ikon==='up'?'var(--accent-ink)':f.ikon==='warn'?'var(--amber)':'var(--muted)'}">${f.ikon==='up'?'↑':f.ikon==='warn'?'!':'i'}</span>

        <th class="r">Revisi</th><th class="r">Tepat waktu</th><th>Skor potensi</th>

        <td class="r num" data-l="Pekerjaan">${g.n}</td>
        <td class="r num" data-l="Laba">${fmtRp(g.laba)}</td>
        <td class="r num" data-l="Hasil per jam" style="font-weight:650">${fmtRp(g.perJam)}</td>
      </tr>`).join('')}
      </tbody></table></div>
      <div class="card-pad" style="border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);line-height:1.5">

      </div>`
      : emptyBox('Asal klien belum diisi','Buka menu Klien, ubah tiap klien, lalu pilih dari mana mereka datang: Instagram, TikTok, LinkedIn, Jobstreet, relasi, atau tulis sendiri.',
          `<a class="btn btn-pri" href="#klien">Buka daftar klien</a>`)}

    <div class="grid g-main">
      <div class="card">

function barisEval(k,buruk){
  const jam=jamDesimal(menitKerja(k)), laba=labaKerja(k);
  const kl=klienOf(k);
  return `<tr class="clickable" data-act="kerjaBuka" data-id="${k.id}">
    <td><div style="font-weight:600">${esc(k.judul||'Tanpa judul')}</div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:2px">${esc(k.jenis)}${kl?' · '+esc(kl.nama):''}${buruk?' · <span style="color:var(--amber);font-weight:600">paling rendah</span>':''}</div></td>
    <td class="r num" style="font-weight:650;color:${buruk?'var(--amber)':'inherit'}">${fmtRp(jam?laba/jam:0)}</td>
    <td class="r num">${fmtRp(laba)}</td>
    <td class="r num" style="color:var(--muted)">${fmtJam(menitKerja(k))}</td>
  </tr>`;
}

function rowDoc(d){
  const k=klienOf(d), s=statusInfo(d), t=TIPE[d.tipe], h=hitung(d);
  return `<tr class="clickable" data-act="open" data-id="${d.id}">
    <td><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="tag">${t.kode}</span>
        <span style="font-weight:600">${esc(d.judul||t.label+' tanpa judul')}</span>
      </div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:3px;font-family:var(--mono)">${esc(d.nomor)} · ${fmtDateShort(d.tanggal)}</div>
    </td>
    <td data-l="Klien">${esc(k?k.nama:'—')}</td>
    <td data-l="Status"><span class="pill ${s.warna}">${s.label}</span></td>
    <td class="r num" data-l="Nilai" style="font-weight:600">${fmtRp(h.total)}</td>
  </tr>`;
}
function emptyBox(t,p,btn){
  return `<div class="empty"><h3>${t}</h3><p>${p}</p>${btn||''}</div>`;
}

/* =======================================================
   9. Daftar dokumen
   ======================================================= */
function viewDokumen(v){
  head('Dokumen', 'Bagian tersendiri, terpisah dari pelacak pekerjaan · '+S.dokumen.length+' dokumen',
    `<button class="btn btn-pri" data-act="baru">${ICON.plus} Dokumen baru</button>`);
  let list = S.dokumen.slice().sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||''));
  if(filter.tipe!=='semua') list=list.filter(d=>d.tipe===filter.tipe);
  if(filter.q){
    const q=filter.q.toLowerCase();
    list=list.filter(d=>{
      const k=klienOf(d);
      return (d.judul||'').toLowerCase().includes(q) || (d.nomor||'').toLowerCase().includes(q) || (k&&k.nama.toLowerCase().includes(q));
    });
  }
  v.innerHTML = `
    <div class="toolrow noprint">
      <div class="seg">
        <button data-act="fTipe" data-tipe="semua" class="${filter.tipe==='semua'?'on':''}">Semua</button>
        ${Object.keys(TIPE).map(t=>`<button data-act="fTipe" data-tipe="${t}" class="${filter.tipe===t?'on':''}">${TIPE[t].label}</button>`).join('')}
      </div>
      <div class="search">${ICON.search}<input type="text" id="q" placeholder="Cari judul, nomor, klien…" value="${esc(filter.q)}"></div>
    </div>
    <div class="card">
      ${list.length? `<table class="resp"><thead><tr>
          <th>Dokumen</th><th>Klien</th><th>Status</th><th class="r">Nilai</th>
        </tr></thead><tbody>${list.map(rowDoc).join('')}</tbody></table>`
        : emptyBox(filter.q||filter.tipe!=='semua'?'Tidak ada yang cocok':'Belum ada dokumen',
            filter.q||filter.tipe!=='semua'?'Coba ubah kata kunci atau pilih jenis lain.':'Buat penawaran, SPK, invoice, atau kwitansi pertama Anda.',
            `<button class="btn btn-pri" data-act="baru">${ICON.plus} Dokumen baru</button>`)}
    </div>`;
  const q=document.getElementById('q');
  if(q) q.addEventListener('input',e=>{
    filter.q=e.target.value;
    const pos=e.target.selectionStart; render();
    const n=document.getElementById('q'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} }
  });
}

function viewEditor(v){
  const d=docOf(editId); if(!d){ go('dokumen'); return; }
  const t=TIPE[d.tipe], s=statusInfo(d);
  head(t.judul,
    `<span style="font-family:var(--mono);font-size:12px">${esc(d.nomor)}</span> · <span class="pill ${s.warna}" style="vertical-align:1px">${s.label}</span>`,
    `<button class="btn" data-act="kembali">${ICON.back} Dokumen</button>
     ${t.lanjut?`<button class="btn" data-act="lanjut">${ICON.arrow} Buat ${TIPE[t.lanjut].label}</button>`:''}
     <button class="btn" data-act="duplikat">${ICON.copy} Duplikat</button>
     <button class="btn btn-danger" data-act="hapusDoc">${ICON.trash} Hapus</button>`);

  v.innerHTML = `<div class="editor">
      <div class="ed-col" id="edCol"></div>
      <div class="sheet-wrap">
        <div class="sheet-bar noprint">
          <div class="eyebrow">Pratinjau dokumen</div>
          <div style="display:flex;gap:7px">
            <button class="btn btn-sm" data-act="salin">${ICON.copy} Salin teks</button>
            <button class="btn btn-sm" data-act="cetak">${ICON.print} Cetak / PDF</button>
            <button class="btn btn-sm btn-pri" data-act="bagikan">${ICON.arrow} Bagikan</button>
          </div>
        </div>
        <div id="sheet"></div>
      </div>
    </div>`;
  renderEdCol(d); renderSheet(d);
}

/* teks dokumen untuk disalin */
function docText(d){
  const p=S.profil,k=klienOf(d),t=TIPE[d.tipe],h=hitung(d);
  const L=[];
  L.push(t.judul.toUpperCase()); L.push('Nomor: '+d.nomor); L.push('');
  L.push('Dari   : '+(p.nama||'-')); if(p.telepon||p.email) L.push('         '+[p.telepon,p.email].filter(Boolean).join(' · '));
  L.push('Kepada : '+(k?k.nama:'-')); if(k&&k.pic) L.push('         u.p. '+k.pic);
  L.push('Tanggal: '+fmtDate(d.tanggal));
  if(d.jatuhTempo) L.push((d.tipe==='invoice'?'Jatuh tempo: ':'Berlaku sampai: ')+fmtDate(d.jatuhTempo));
  if(d.judul) L.push('Pekerjaan: '+d.judul);
  L.push('');
  h.items.filter(i=>i.desc||i.jumlah).forEach((i,n)=>{
    L.push((n+1)+'. '+i.desc+' — '+fmtNum(i.qty)+' '+i.satuan+' × '+fmtRp(i.harga)+' = '+fmtRp(i.jumlah));
  });
  L.push('');
  L.push('Subtotal : '+fmtRp(h.sub));
  if(h.diskon) L.push('Diskon   : −'+fmtRp(h.diskon));
  if(h.ppn) L.push('PPN      : '+fmtRp(h.ppn));
  L.push('TOTAL    : '+fmtRp(h.total));
  if(h.dp){ L.push('Uang muka: −'+fmtRp(h.dp)); L.push('Sisa     : '+fmtRp(h.sisa)); }
  L.push('('+terbilang(h.dp?h.sisa:h.total)+')');
  { const rk=rekeningDok(d); if(rk.length){ L.push(''); L.push('Pembayaran:'); rk.forEach(r=>L.push('• '+teksRek(r))); } }
  if(d.catatan){ L.push(''); L.push('Catatan: '+d.catatan); }
  if(d.syarat&&d.tipe!=='kwitansi'){ L.push(''); L.push('Syarat & ketentuan:'); L.push(d.syarat); }
  return L.join('\n');
}

/* ---- jendela Drive & kalender ---- */
function modalDrive(k){
  openModal({
    title:'Cari berkas di Drive',
    sub:'Memakai konektor Google Drive Anda. Yang diambil hanya nama dan alamat berkas.',
    body:`<div class="field"><label>Kata kunci</label>
        <div style="display:flex;gap:7px">
          <input type="text" id="dv_q" value="${esc(k.judul||'')}" placeholder="Nama berkas">
          <button class="btn btn-sm btn-pri" id="dv_go">Cari</button>
        </div></div>
      <div id="dv_hasil" style="margin-top:14px;font-size:13px;color:var(--muted)">Tekan Cari untuk mulai.</div>`,
    cancel:'Tutup'
  });
  setTimeout(()=>{
    const q=document.getElementById('dv_q'), go=document.getElementById('dv_go'), out=document.getElementById('dv_hasil');
    if(!go||!out) return;
    const jalan=async()=>{
      out.innerHTML='Mencari…';
      try{
        const f=await cariDrive(q.value);
        if(!f.length){ out.innerHTML='Tidak ada berkas yang namanya memuat kata itu.'; return; }
        out.innerHTML=f.map(b=>`<div class="logrow">
          <a href="${esc(b.url)}" target="_blank" rel="noopener" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.nama)}</a>
          <button class="btn btn-sm" data-act="driveLampir" data-f="${encodeURIComponent(JSON.stringify({nama:b.nama,url:b.url}))}">Tautkan</button>
        </div>`).join('');
      }catch(err){
        const kode=(err&&(err.code||err.message))||'';
        out.innerHTML = /not_connected|tak-ada/.test(String(kode))
          ? 'Konektor Google Drive belum tersambung di akun ini. Buka Drive lewat tombol di halaman pekerjaan, lalu tempel tautannya.'
          : 'Pencarian gagal dijalankan'+(kode?' ('+esc(String(kode))+')':'')+'. Coba lagi, atau tempel tautannya sendiri.';
      }
    };
    go.addEventListener('click',jalan);
    q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); jalan(); } });
    q.focus(); q.select();
  },50);
}

let modalOk=null;
function openModal(o){
  modalOk=o.onOk||null;
  document.getElementById('modalRoot').innerHTML=`
    <div class="backdrop" data-act="modalBg">
      <div class="modal" role="dialog" aria-modal="true">
        <header><h3>${o.title}</h3>${o.sub?`<p>${o.sub}</p>`:''}</header>
        <div class="body">${o.body}</div>
        <footer>
          <button class="btn" data-act="modalTutup">${o.cancel||'Batal'}</button>
          ${o.ok?`<button class="btn ${o.danger?'btn-danger':'btn-pri'}" data-act="modalOk">${o.ok}</button>`:''}
        </footer>
      </div>
    </div>`;
}
function closeModal(){ modalOk=null; document.getElementById('modalRoot').innerHTML=''; }
let toastT=null;
function toast(msg){
  const r=document.getElementById('toastRoot');
  r.innerHTML=`<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toastT); toastT=setTimeout(()=>{r.innerHTML='';},2600);
}
function copyText(txt,okMsg){
  const done=()=>toast(okMsg||'Tersalin.');
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done,()=>fallback());
    } else fallback();
  }catch(e){ fallback(); }
  function fallback(){
    try{
      const ta=document.createElement('textarea');
      ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done();
    }catch(e2){ toast('Tidak bisa menyalin otomatis. Pilih teksnya lalu salin manual.'); }
  }
}

        <button class="jwarna jwarna-btn" data-act="bWarna" data-id="${b.id}" style="background:${b.warna}" title="Ganti warna bidang" aria-label="Ganti warna bidang ${esc(b.nama)}"></button>

function urutTukar(arr, i, j){ if(i<0||j<0||i>=arr.length||j>=arr.length) return; const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
function geserJenis(id, arah){
  const c=JC(), j=c.jenis.find(x=>x.id===id); if(!j) return;
  /* tukar dengan tetangga di kelompok yang sama */
  const kunci = x => bidangOf(x.bidangId) ? x.bidangId : '';
  const se = c.datar ? c.jenis : c.jenis.filter(x=>kunci(x)===kunci(j));
  const p=se.indexOf(j), q=se[p+arah]; if(!q) return;
  urutTukar(c.jenis, c.jenis.indexOf(j), c.jenis.indexOf(q));
  save(); render();
}
function aksiJenis(act, el){
  const c=JC(), id=el.dataset.id;
  const sel=c.jenis.find(j=>j.id===jenisPilih);
  if(act==='jPilih'){ if(jenisPilih!==id){ jenisPilih=id; render(); } return true; }
  if(act==='jDatar'){ c.datar = el.dataset.v==='1'; save(); render(); return true; }
  if(act==='jNaik'){ geserJenis(id,-1); return true; }
  if(act==='jTurun'){ geserJenis(id,1); return true; }
  if(act==='bNaik'||act==='bTurun'){
    const i=c.bidang.findIndex(b=>b.id===id); urutTukar(c.bidang,i,i+(act==='bNaik'?-1:1)); save(); render(); return true;
  }
  if(act==='bBaru'){
    const b={id:uid(), nama:'Bidang baru', warna:WARNA_BIDANG[c.bidang.length%WARNA_BIDANG.length]};
    c.bidang.push(b); save(); render();
    const inp=document.querySelector(`[data-bd="${b.id}"]`); if(inp){ inp.focus(); inp.select(); }
    return true;
  }
  if(act==='bUbah'){ const inp=document.querySelector(`[data-bd="${id}"]`); if(inp){ inp.focus(); inp.select(); } return true; }
  if(act==='bWarna'){
    const b=bidangOf(id); if(!b) return true;
    const i=WARNA_BIDANG.indexOf(b.warna); b.warna=WARNA_BIDANG[(i+1)%WARNA_BIDANG.length]; save(); render(); return true;
  }
  if(act==='bHapus'){
    const b=bidangOf(id); if(!b) return true;
    c.bidang=c.bidang.filter(x=>x.id!==id); save(); render(); toast('Bidang "'+b.nama+'" dihapus.'); return true;
  }
  if(act==='jBaru'){
    let nama='Jenis baru', i=2; while(jenisInfo(nama)) nama='Jenis baru '+(i++);
    const j={id:uid(), nama, bidangId:id||'', tarif:0, sembunyi:false};
    const akhir=c.jenis.map(x=>x.bidangId).lastIndexOf(j.bidangId);
    c.jenis.splice(akhir>=0?akhir+1:c.jenis.length, 0, j);
    jenisPilih=j.id; save(); render();
    const inp=document.getElementById('jNama'); if(inp){ inp.focus(); inp.select(); }
    return true;
  }
  if(!sel) return false;
  if(act==='jGantiNama'){
    const inp=document.getElementById('jNama'); const baru=(inp&&inp.value||'').trim();
    if(!baru){ toast('Nama jenis tidak boleh kosong.'); return true; }
    if(baru===LAINNYA || (jenisInfo(baru) && jenisInfo(baru)!==sel)){ toast('Nama itu sudah dipakai. Pakai "Gabungkan" kalau maksudnya menyatukan.'); return true; }
    const n=gantiNamaJenis(sel, baru); save(); render();
    toast(n? 'Nama diganti — '+n+' pekerjaan ikut diperbarui.' : 'Nama diganti.');
    return true;
  }
  if(act==='jGabung'){
    const n=jenisDipakai(sel.nama);
    const lain=c.jenis.filter(j=>j.id!==sel.id);
    openModal({ title:'Gabungkan jenis', sub:'Pekerjaan dari jenis ini dipindah, lalu jenis ini dihapus dari daftar.',
      body:`<div class="grid" style="gap:12px;font-size:13.5px">
        <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
          <span class="pill p-grey" style="font-size:12.5px">${esc(sel.nama)} · ${n}</span><span aria-hidden="true">→</span>
          <select id="jGabungKe" style="flex:1;min-width:180px">${lain.slice().sort((a,b)=>(b.bidangId===sel.bidangId)-(a.bidangId===sel.bidangId)).map(j=>`<option value="${j.id}">${esc(j.nama)} · ${jenisDipakai(j.nama)}</option>`).join('')}</select>
        </div>
        <ul style="margin:0;padding-left:18px;line-height:1.6;color:var(--ink-2)">
          <li>${n} pekerjaan pindah ke jenis tujuan.</li>
          <li>Tarif acuan mengikuti jenis tujuan.</li>
          <li>"${esc(sel.nama)}" dihapus dari daftar.</li>
        </ul></div>`,
      ok:'Gabungkan',
      onOk(){
        const ke=c.jenis.find(j=>j.id===document.getElementById('jGabungKe').value); if(!ke) return false;
        const m=pindahkanPekerjaan(sel.nama, ke.nama);
        c.jenis=c.jenis.filter(j=>j.id!==sel.id); jenisPilih=ke.id; save(); render();
        toast('Digabung ke '+ke.nama+' — '+m+' pekerjaan dipindah.');
      }});
    return true;
  }
  if(act==='jHapus'){
    const n=jenisDipakai(sel.nama);
    const lain=c.jenis.filter(j=>j.id!==sel.id);
    if(!n){
      openModal({ title:'Hapus "'+esc(sel.nama)+'"?', sub:'Jenis ini belum dipakai pekerjaan mana pun.', body:'', ok:'Hapus', danger:true,
        onOk(){ c.jenis=c.jenis.filter(j=>j.id!==sel.id); jenisPilih=null; save(); render(); toast('Jenis dihapus.'); } });
      return true;
    }
    openModal({ title:'Hapus "'+esc(sel.nama)+'"?', sub:'Jenis ini masih dipakai '+n+' pekerjaan. Pilih apa yang terjadi padanya.',
      body:`<div class="grid" style="gap:10px;font-size:13.5px">
        <label class="jopsi"><input type="radio" name="jHapusCara" value="pindah" checked>
          <span><strong>Pindahkan ke jenis lain, lalu hapus</strong>
          <select id="jHapusKe" style="display:block;margin-top:7px;width:100%">${lain.slice().sort((a,b)=>(b.bidangId===sel.bidangId)-(a.bidangId===sel.bidangId)).map(j=>`<option value="${esc(j.nama)}">${esc(j.nama)}${bidangOf(j.bidangId)&&!c.datar?' · '+esc(bidangOf(j.bidangId).nama):''}</option>`).join('')}<option value="${LAINNYA}">${LAINNYA}</option></select></span></label>
        <label class="jopsi"><input type="radio" name="jHapusCara" value="sembunyi">
          <span><strong>Sembunyikan saja</strong><span class="hint" style="display:block;margin-top:2px">Pekerjaan lama tetap memakai jenis ini, tapi tidak muncul lagi di pilihan.</span></span></label>
      </div>`,
      ok:'Lanjutkan', danger:true,
      onOk(){
        const cara=(document.querySelector('input[name="jHapusCara"]:checked')||{}).value;
        if(cara==='sembunyi'){ sel.sembunyi=true; save(); render(); toast('Disembunyikan. Riwayatnya tetap utuh.'); return; }
        const ke=document.getElementById('jHapusKe').value;
        const m=pindahkanPekerjaan(sel.nama, ke);
        c.jenis=c.jenis.filter(j=>j.id!==sel.id); jenisPilih=null; save(); render();
        toast(m+' pekerjaan dipindah ke '+ke+', jenis dihapus.');
      }});
    return true;
  }
  return false;
}

function pilihTipe(){
  openModal({
    title:'Dokumen baru', sub:'Pilih jenis dokumen yang ingin dibuat.',
    body:`<div class="grid" style="gap:9px">
      ${Object.keys(TIPE).map(t=>`
        <button data-act="baruTipe" data-tipe="${t}" style="display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 14px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface)">
          <span style="flex:0 0 auto;width:34px;height:34px;border-radius:8px;background:var(--accent-tint);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--serif);font-size:11.5px;font-weight:700">${TIPE[t].kode}</span>
          <span>
            <span style="display:block;font-size:14.5px;font-weight:600">${TIPE[t].label}</span>
            <span style="display:block;font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px">${TIPE[t].desc}</span>

function buatDoc(tipe,dari){
  const d=newDoc(tipe); bumpNomor(tipe);
  if(dari){
    const a=docOf(dari);
    if(a){
      Object.assign(d,{
        klienId:a.klienId, judul:a.judul,
        items:(a.items||[]).map(i=>({id:uid(),desc:i.desc,qty:i.qty,satuan:i.satuan,harga:i.harga})),
        diskonPersen:a.diskonPersen, ppnAktif:a.ppnAktif, ppnPersen:a.ppnPersen,
        catatan:a.catatan, syarat:a.syarat, metode:a.metode, asal:a.nomor
      });
      if(tipe==='kwitansi'){ d.dp=hitung(a).total; d.status='terbit'; }
    }
  }
  S.dokumen.unshift(d); save(); openDoc(d.id);
  toast(TIPE[tipe].label+' dibuat: '+d.nomor);
}
function hapusDoc(id){
  const d=docOf(id); if(!d) return;
  openModal({
    title:'Hapus dokumen?', sub:esc(d.nomor)+' akan dihapus permanen dari perangkat ini.',
    body:`<div style="font-size:13.5px;color:var(--ink-2)">${esc(d.judul||TIPE[d.tipe].label)} — ${fmtRp(hitung(d).total)}</div>`,
    ok:'Hapus', danger:true,
    onOk(){ S.dokumen=S.dokumen.filter(x=>x.id!==id); save(); go('dokumen'); toast('Dokumen dihapus.'); }
  });
}

document.addEventListener('click',function(e){
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id;

  if(act==='modalBg'){ if(e.target===el) closeModal(); return; }
  if(act==='modalTutup'){ closeModal(); return; }
  if(act==='modalOk'){ const fn=modalOk; if(fn && fn()!==false) closeModal(); return; }

  /* ---- sinkron laptop ↔ HP ---- */
  if(act==='sinkSambung'){
    const tk=(document.getElementById('sinkToken')||{}).value, sd=(document.getElementById('sinkSandi')||{}).value;
    el.disabled=true; el.textContent='Menyambungkan…';
    sambungkanSinkron(tk, sd).then(h=>{
      render(); toast(h==='baru'? 'Tersambung. Data perangkat ini sudah tersimpan online — sambungkan perangkat lain dengan token & kata sandi yang sama.' : 'Tersambung. Data dari perangkat lain sudah digabung ke sini.');
    }).catch(e=>{ el.disabled=false; el.textContent='Sambungkan'; toast((e&&e.pesan)||'Gagal menyambungkan.'); });
    return;
  }
  if(act==='sinkSekarang'){ sinkron({lapor:true, paksa:true}).then(()=>{ if(!sink.galat) toast('Tersinkron.'); }); return; }
  if(act==='sinkPutus'){
    openModal({ title:'Putuskan sinkron di perangkat ini?', sub:'Data di perangkat ini dan salinan online tetap ada. Perangkat ini hanya berhenti mengirim dan mengambil perubahan.', body:'', ok:'Putuskan', danger:true,
      onOk(){ putuskanSinkron(); render(); toast('Sinkron diputus di perangkat ini.'); } });
    return;
  }

  /* ---- jadwal dari Ofa ---- */
  if(act==='ofaJadikan'||act==='ofaTempel'||act==='ofaAbaikan'){ aksiOfa(act, el); return; }

  /* ---- jenis pekerjaan & kalender ---- */
  if(route==='jenis' && aksiJenis(act, el)) return;
  if(act==='gcalSinkron'){ const k=kerjaOf(kerjaId); if(k){ const p=sinkronKalender(k); segarkanGcal(k); } return; }
  if(act==='gcalLepas'){ lepasKalender(kerjaOf(kerjaId)); return; }
  if(act==='gcalSemua'){
    const daftar=S.pekerjaan.filter(k=>AKTIF.indexOf(k.status)>=0 && k.tenggat);
    if(!daftar.length){ toast('Tidak ada pekerjaan aktif bertenggat.'); return; }
    el.disabled=true; el.textContent='Menyimpan '+daftar.length+' tenggat…';
    (async()=>{ let ok=0; for(const k of daftar){ if(await sinkronKalender(k,true)) ok++; }
      render(); toast(ok===daftar.length? ok+' tenggat tersimpan di Google Calendar.' : ok+' dari '+daftar.length+' tenggat tersimpan. Sisanya gagal — coba lagi.'); })();
    return;
  }

  /* ---- pekerjaan ---- */
  if(act==='kerjaBaru'){
    const k=newKerja(); S.pekerjaan.unshift(k); save(); openKerja(k.id);
    toast('Pekerjaan baru dibuat. Isi judul dan tenggatnya.'); return;
  }
  if(act==='kerjaBuka'){ openKerja(id); return; }
  if(act==='kKembali'){ go('pekerjaan'); return; }
  if(act==='kTampil'){ kfilter.tampil=el.dataset.v; render(); return; }
  if(act==='evBulan'){ ev.bulan=num(el.dataset.v); render(); return; }
  if(act==='evLingkup'){ ev.lingkup=el.dataset.v; render(); return; }
  if(act==='evPer'){ ev.per=el.dataset.v; render(); return; }
  if(act==='kStatus'){ kfilter.status=el.dataset.v; render(); return; }
  if(act==='timerStart'){ mulaiTimer(id); return; }
  if(act==='timerStop'){ hentikanTimer(id); return; }
  if(act==='kHapus'){
    const k=kerjaOf(kerjaId); if(!k) return;
    openModal({ title:'Hapus pekerjaan?', sub:'Semua jam, pembayaran, dan catatan revisinya ikut hilang.',
      body:`<div style="font-size:13.5px;color:var(--ink-2)">${esc(k.judul||'Tanpa judul')}</div>`, ok:'Hapus', danger:true,
      onOk(){ if(k.gcal&&k.gcal.id&&KEMAMPUAN.mcp) panggilAlat(GCAL,'delete_event',{eventId:k.gcal.id,notificationLevel:'NONE'}).catch(()=>{});
        S.pekerjaan=S.pekerjaan.filter(x=>x.id!==k.id); save(); go('pekerjaan'); toast('Pekerjaan dihapus.'); } });
    return;
  }
  if(act==='tahapTambah'){
    const k=kerjaOf(kerjaId), inp=document.getElementById('tahapBaru'); if(!k||!inp) return;
    const nm=inp.value.trim(); if(!nm){ inp.focus(); return; }
    k.tahapan.push({id:uid(),nama:nm,selesai:false}); save(); render();
    const n=document.getElementById('tahapBaru'); if(n) n.focus();
    return;
  }
  if(act==='tahapHapus'){
    e.preventDefault();
    const k=kerjaOf(kerjaId); if(!k) return;
    k.tahapan=k.tahapan.filter(t=>t.id!==el.dataset.i); save(); render(); return;
  }
  if(act==='sesiTambah'){
    const k=kerjaOf(kerjaId); if(!k) return;
    openModal({ title:'Catat jam kerja', sub:'Untuk sesi yang lupa Anda nyalakan timernya.',
      body:`<div class="grid g2" style="gap:13px">
        <div class="field"><label>Tanggal</label><input type="date" id="s_tgl" value="${today()}"></div>
        <div class="field"><label>Lama (menit)</label><input type="text" class="right" id="s_menit" value="60" inputmode="numeric"></div>
        <div class="field" style="grid-column:1/-1"><label>Catatan <span class="hint">(opsional)</span></label>
          <input type="text" id="s_cat" placeholder="Mis. revisi layout halaman 3"></div>
      </div>`, ok:'Catat',
      onOk(){
        const m=digits(val('s_menit')); if(!m){ toast('Lama kerja belum diisi.'); return false; }
        k.sesi.unshift({id:uid(),tgl:val('s_tgl')||today(),menit:m,catatan:val('s_cat')});
        save(); render(); toast(fmtJam(m)+' tercatat.');
      } });
    return;
  }
  if(act==='sesiHapus'){
    const k=kerjaOf(kerjaId); if(!k) return;
    k.sesi=k.sesi.filter(s=>s.id!==el.dataset.i); save(); render(); return;
  }
  if(act==='bayarTambah'){
    const k=kerjaOf(kerjaId); if(!k) return;
    const sisa=Math.max(0,nilaiKerja(k)-dibayarKerja(k));
    openModal({ title:'Catat pembayaran', sub:'Uang yang sudah benar-benar Anda terima.',
      body:`<div class="grid g2" style="gap:13px">
        <div class="field"><label>Tanggal</label><input type="date" id="b_tgl" value="${today()}"></div>
        <div class="field"><label>Jumlah</label><input type="text" class="right" id="b_jml" value="${new Intl.NumberFormat('id-ID').format(Math.round(sisa))}" inputmode="numeric"></div>
        <div class="field" style="grid-column:1/-1"><label>Catatan <span class="hint">(opsional)</span></label>
          <input type="text" id="b_cat" placeholder="Mis. DP 50% lewat transfer BCA"></div>
      </div>`, ok:'Catat',
      onOk(){
        const j=digits(val('b_jml')); if(!j){ toast('Jumlah belum diisi.'); return false; }
        k.pembayaran.unshift({id:uid(),tgl:val('b_tgl')||today(),jumlah:j,catatan:val('b_cat')});
        save(); render(); toast(fmtRp(j)+' dicatat.');
      } });
    return;
  }
  if(act==='bayarHapus'){
    const k=kerjaOf(kerjaId); if(!k) return;
    k.pembayaran=k.pembayaran.filter(p=>p.id!==el.dataset.i); save(); render(); return;
  }
  if(act==='revisiTambah'){
    const k=kerjaOf(kerjaId); if(!k) return;
    openModal({ title:'Catat revisi', sub:'Supaya jelas berapa kali jatah revisi sudah terpakai.',
      body:`<div class="grid" style="gap:13px">
        <div class="field"><label>Tanggal</label><input type="date" id="r_tgl" value="${today()}"></div>
        <div class="field"><label>Permintaan klien</label>
          <textarea id="r_cat" style="min-height:66px" placeholder="Mis. ganti warna utama jadi biru, perbesar logo"></textarea></div>
      </div>`, ok:'Catat revisi',
      onOk(){
        k.revisi.push({id:uid(),tgl:val('r_tgl')||today(),catatan:val('r_cat')});
        if(k.status==='review') k.status='revisi';
        save(); render();
        const j=num(k.revisiJatah);
        toast(j && k.revisi.length>j ? 'Tercatat — ini sudah lewat jatah revisi.' : 'Revisi tercatat.');
      } });
    return;
  }
  if(act==='berkasTambah'){
    const k=kerjaOf(kerjaId); if(!k) return;
    openModal({ title:'Tambah tautan', sub:'Tempel alamat berkas dari Drive, Figma, Notion, atau mana pun.',
      body:`<div class="grid" style="gap:13px">
        <div class="field"><label>Alamat (URL)</label><input type="text" id="t_url" placeholder="https://drive.google.com/..."></div>
        <div class="field"><label>Nama <span class="hint">(opsional)</span></label><input type="text" id="t_nama" placeholder="Brief klien"></div>
      </div>`, ok:'Tambah',
      onOk(){
        let u=val('t_url'); if(!u){ toast('Alamatnya belum diisi.'); return false; }
        if(!/^https?:\/\//i.test(u)) u='https://'+u;
        k.berkas=k.berkas||[]; k.berkas.push({id:uid(),nama:val('t_nama')||u.replace(/^https?:\/\//,'').slice(0,42),url:u});
        save(); render(); toast('Tautan ditambahkan.');
      } });
    return;
  }
  if(act==='berkasHapus'){
    const k=kerjaOf(kerjaId); if(!k) return;
    k.berkas=(k.berkas||[]).filter(b=>b.id!==el.dataset.i); save(); render(); return;
  }
  if(act==='driveCari'){
    const k=kerjaOf(kerjaId); if(!k) return;
    if(!KEMAMPUAN.mcp){
      openModal({ title:'Drive belum tersambung',
        sub:'Pencarian langsung memakai konektor Google Drive milik Anda di claude.ai.',
        body:`<div style="font-size:13.5px;color:var(--ink-2);line-height:1.55">
          Halaman ini tidak menyimpan kata sandi atau token apa pun — pencarian berjalan atas izin Anda sendiri, dan hanya saat tombolnya ditekan.
          <br><br>Selama konektornya belum aktif, buka Drive lewat tombol “Buka Drive”, lalu salin alamat berkasnya ke sini sebagai tautan.
        </div>`, ok:'Mengerti', onOk(){ return true; } });
      return;
    }
    modalDrive(k);
    return;
  }
  if(act==='driveLampir'){
    const k=kerjaOf(kerjaId); if(!k) return;
    const d=JSON.parse(decodeURIComponent(el.dataset.f||'%7B%7D'));
    if(!d.url) return;
    k.berkas=k.berkas||[];
    if(k.berkas.some(b=>b.url===d.url)){ toast('Berkas itu sudah tertaut.'); return; }
    k.berkas.push({id:uid(),nama:d.nama,url:d.url}); save();
    el.textContent='Tertaut'; el.disabled=true; el.classList.add('btn-ghost');
    toast('“'+d.nama+'” ditautkan.');
    return;
  }
  if(act==='icsEkspor'){ modalKalender(); return; }
  if(act==='icsUnduh'){
    const {teks,n}=icsSemua();
    if(!KEMAMPUAN.unduh){ toast('Unduhan tidak tersedia di tampilan ini. Pakai tombol salin.'); return; }
    KEMAMPUAN.unduh.save({filename:'tenggat-niras.ics', data:teks})
      .then(()=>toast(n+' tenggat tersimpan sebagai berkas .ics.'))
      .catch(()=>toast('Unduhan dibatalkan atau ditolak.'));
    return;
  }
  if(act==='icsSalin'){ copyText(icsSemua().teks,'Teks .ics tersalin.'); return; }
  if(act==='revisiHapus'){
    const k=kerjaOf(kerjaId); if(!k) return;
    k.revisi=k.revisi.filter(r=>r.id!==el.dataset.i); save(); render(); return;
  }

  if(act==='baru'){ pilihTipe(); return; }
  if(act==='baruTipe'){ closeModal(); buatDoc(el.dataset.tipe); return; }
  if(act==='open'){ openDoc(id); return; }
  if(act==='kembali'){ go('dokumen'); return; }
  if(act==='fTipe'){ filter.tipe=el.dataset.tipe; render(); return; }
  if(act==='hapusDoc'){ hapusDoc(editId); return; }
  if(act==='duplikat'){
    const a=docOf(editId); if(!a) return;
    const d=JSON.parse(JSON.stringify(a));
    d.id=uid(); d.nomor=nextNomor(a.tipe); bumpNomor(a.tipe);
    d.status='draf'; d.tanggal=today(); d.items=d.items.map(i=>({...i,id:uid()}));
    S.dokumen.unshift(d); save(); openDoc(d.id); toast('Duplikat dibuat: '+d.nomor); return;
  }
  if(act==='lanjut'){
    const a=docOf(editId); if(!a) return;
    const t=TIPE[a.tipe].lanjut; if(!t) return;
    buatDoc(t,a.id); return;
  }
  if(act==='cetak'){
    try{ window.print(); }
    catch(err){ toast('Cetak diblokir di panel ini. Buka halaman di tab tersendiri lalu tekan Ctrl/Cmd+P.'); }
    return;
  }
  if(act==='salin'){ const d=docOf(editId); if(d) copyText(docText(d),'Teks dokumen tersalin.'); return; }
  if(act==='bagikan'){ const d=docOf(editId); if(d) modalBagikan(d); return; }
  if(act==='bagiWA'||act==='bagiEmail'||act==='bagiTG'||act==='bagiPDF'||act==='bagiUnduh'){ aksiBagi(act); return; }
  if(act==='docRek'){
    const d=docOf(editId); if(!d) return;
    const ids=rekeningDok(d).map(r=>r.id).filter(x=>x!==id);
    if(el.checked) ids.push(id);
    d.rekeningIds=daftarRekening().map(r=>r.id).filter(x=>ids.indexOf(x)>=0);
    save(); renderSheet(d); return;
  }
  if(act==='rekTambah'){ daftarRekening().push({id:uid(), bank:'', nomor:'', atasNama:S.profil.atasNama||'', bawaan:false}); save(); render(); return; }
  if(act==='rekHapus'){ S.profil.rekeningList=daftarRekening().filter(r=>r.id!==id); save(); render(); toast('Rekening dihapus.'); return; }
  if(act==='itemBaru'){
    const d=docOf(editId); if(!d) return;
    d.items.push({id:uid(),desc:'',qty:1,satuan:'paket',harga:0}); save(); renderEdCol(d); renderSheet(d); return;
  }
  if(act==='itemHapus'){
    const d=docOf(editId); if(!d) return;
    if(d.items.length<=1){ d.items=[{id:uid(),desc:'',qty:1,satuan:'paket',harga:0}]; }
    else d.items=d.items.filter(i=>i.id!==el.dataset.i);
    save(); renderEdCol(d); renderSheet(d); return;
  }
  if(act==='klienBaru'){ modalKlien(null); return; }
  if(act==='klienEdit'){ modalKlien(id); return; }
  if(act==='klienHapus'){
    const k=S.klien.find(x=>x.id===id); if(!k) return;
    const pakai=S.dokumen.filter(d=>d.klienId===id).length;
    openModal({ title:'Hapus klien?',
      sub: pakai? pakai+' dokumen memakai klien ini. Dokumennya tetap ada, tapi nama klien jadi kosong.' : 'Data klien ini akan dihapus.',
      body:`<div style="font-size:13.5px;color:var(--ink-2)">${esc(k.nama)}</div>`, ok:'Hapus', danger:true,
      onOk(){ S.klien=S.klien.filter(x=>x.id!==id); save(); render(); toast('Klien dihapus.'); } });
    return;
  }
  if(act==='logoPilih'){ const f=document.getElementById('logoFile'); if(f) f.click(); return; }
  if(act==='logoHapus'){ S.profil.logo=''; save(); render(); toast('Logo dihapus.'); return; }
  if(act==='hapusContoh'){
    openModal({ title:'Hapus data contoh?', sub:'Dokumen dan klien contoh akan dihapus. Pengaturan usaha dikosongkan agar bisa Anda isi sendiri.',
      body:`<div style="font-size:13.5px;color:var(--ink-2)">Setelah ini Niras mulai dari kosong.</div>`, ok:'Hapus data contoh', danger:true,
      onOk(){ S=JSON.parse(JSON.stringify(BLANK)); S.jenisCfg=strukturBaru(); S.contoh=false; save(); go('pengaturan'); toast('Siap dipakai. Mulai dari Pengaturan.'); } });
    return;
  }
  if(act==='resetSemua'){
    openModal({ title:'Hapus semua data?', sub:'Seluruh dokumen, klien, dan pengaturan di perangkat ini akan hilang. Tidak bisa dibatalkan.',
      body:`<div style="font-size:13.5px;color:var(--ink-2)">Salin cadangan dulu jika masih dibutuhkan.</div>`, ok:'Hapus semua', danger:true,
      onOk(){ S=JSON.parse(JSON.stringify(BLANK)); S.jenisCfg=strukturBaru(); S.contoh=false; save(); go('beranda'); toast('Semua data dihapus.'); } });
    return;
  }
  if(act==='cadangSalin'){
    const txt=JSON.stringify(S,null,2);
    openModal({ title:'Cadangan data', sub:'Salin seluruh teks ini dan simpan di tempat aman — catatan, email ke diri sendiri, atau penyimpanan awan.',
      body:`<textarea id="bk" style="min-height:190px;font-family:var(--mono);font-size:11.5px" readonly>${esc(txt)}</textarea>`,
      ok:'Salin ke papan klip', onOk(){ copyText(txt,'Cadangan tersalin.'); return true; } });
    return;
  }
  if(act==='cadangPulih'){
    openModal({ title:'Pulihkan dari cadangan', sub:'Tempelkan teks cadangan di bawah. Data yang ada sekarang akan diganti.',
      body:`<textarea id="rs" style="min-height:170px;font-family:var(--mono);font-size:11.5px" placeholder='{ "profil": … }'></textarea>`,
      ok:'Pulihkan', danger:true,
      onOk(){
        const raw=(document.getElementById('rs')||{value:''}).value.trim();
        if(!raw){ toast('Teks cadangan masih kosong.'); return false; }
        try{
          const p=JSON.parse(raw);
          if(!p||typeof p!=='object'||!Array.isArray(p.dokumen)) throw new Error('bad');
          S=Object.assign({},BLANK,p);
          S.profil=Object.assign({},BLANK.profil,p.profil||{});
          S.klien=Array.isArray(p.klien)?p.klien:[];
          S.pekerjaan=Array.isArray(p.pekerjaan)?p.pekerjaan:[];
          if(!S.jenisCfg||!Array.isArray(S.jenisCfg.jenis)||!Array.isArray(S.jenisCfg.bidang)) S.jenisCfg=strukturDariLama(S.profil.jenis,S.pekerjaan);
          migrasiBidang2(S.jenisCfg);
          save(); go('beranda'); toast('Data berhasil dipulihkan.');
        }catch(err){ toast('Teks cadangan tidak dikenali. Pastikan tersalin lengkap.'); return false; }
      } });
    return;
  }
});

/* input dokumen */
document.addEventListener('input',function(e){
  const t=e.target;
  if(t.dataset && t.dataset.p!==undefined){
    const k=t.dataset.p;
    if(k==='gcalOtomatis') S.profil.gcalOtomatis=t.checked;
    else if(k==='ppn'||k==='tempoHari'||k==='tarifJam'||k==='jamTarget') S.profil[k]=digits(t.value);
    else S.profil[k]=t.value;
    save();
    if(k==='inisial'){
      const h=t.closest('.field').querySelector('.hint strong'); if(h) h.textContent=(t.value||'NRS').toUpperCase();
    }
    return;
  }
  if(t.dataset && t.dataset.rek){
    const r=daftarRekening().find(x=>x.id===t.dataset.id); if(!r) return;
    if(t.dataset.rek==='bawaan') r.bawaan=t.checked; else r[t.dataset.rek]=t.value;
    const u=daftarRekening()[0]; if(u){ S.profil.bank=u.bank; S.profil.rekening=u.nomor; S.profil.atasNama=u.atasNama; }
    save(); return;
  }
  if(route==='jenis' && t.dataset && t.dataset.jf==='tarif'){
    const j=JC().jenis.find(x=>x.id===jenisPilih); if(!j) return;
    j.tarif=digits(t.value); save(); return;
  }
  if(route==='jenis' && t.dataset && t.dataset.bd){
    const b=bidangOf(t.dataset.bd); if(!b) return;
    b.nama=t.value.trim()||b.nama; save(); return;
  }
  if(route==='kerja' && t.dataset && t.dataset.kf){
    const k=kerjaOf(kerjaId); if(!k) return;
    const f=t.dataset.kf;
    if(f==='nilai'||f==='tarifJam'||f==='biaya') k[f]=digits(t.value);
    else if(f==='estimasiJam'||f==='revisiJatah') k[f]=num(t.value);
    else k[f]=t.value;
    save();
    if(f==='judul'){ document.getElementById('pageTitle').textContent = t.value || 'Pekerjaan tanpa judul'; jadwalkanGcal(k); }
    if(f==='nilai'||f==='tarifJam'||f==='estimasiJam'||f==='revisiJatah'||f==='biaya') segarkanKerja();
    if(f==='tenggat'){
      const tg=labelTenggat(k), st=kstat(k.status);
      document.getElementById('pageSub').innerHTML=`<span class="pill ${st[2]}" style="vertical-align:1px">${st[1]}</span> · <span class="due ${tg.kelas}">${tg.teks}</span>`;
      segarkanGcal(k); jadwalkanGcal(k);
    }
    return;
  }
  if(route!=='editor') return;
  const d=docOf(editId); if(!d) return;
  if(t.dataset && t.dataset.f){
    const f=t.dataset.f;
    if(f==='ppnAktif'){ d.ppnAktif=t.checked; save(); renderEdCol(d); renderSheet(d); return; }
    if(f==='dp') d.dp=digits(t.value);
    else if(f==='diskonPersen'||f==='ppnPersen') d[f]=num(t.value);
    else d[f]=t.value;
    save();
    if(f==='diskonPersen'||f==='ppnPersen'||f==='dp') refreshTotals(d);
    renderSheet(d); return;
  }
  if(t.dataset && t.dataset.i){
    const it=d.items.find(x=>x.id===t.dataset.i); if(!it) return;
    const k=t.dataset.k;
    it[k] = (k==='harga')? digits(t.value) : (k==='qty')? num(t.value) : t.value;
    save();
    const row=t.closest('tr');
    if(row){ const amt=row.querySelector('.amt'); if(amt) amt.textContent=fmtRp(num(it.qty)*num(it.harga)); }
    refreshTotals(d); renderSheet(d); return;
  }
});
function refreshTotals(d){
  const box=document.querySelector('.totals'); if(!box) return;
  const h=hitung(d);
  box.innerHTML = `
    <div class="row"><span>Subtotal</span><span>${fmtRp(h.sub)}</span></div>
    ${h.diskon?`<div class="row"><span>Diskon ${fmtNum(d.diskonPersen)}%</span><span>−${fmtRp(h.diskon)}</span></div>`:''}
    ${h.ppn?`<div class="row"><span>PPN ${fmtNum(d.ppnPersen)}%</span><span>${fmtRp(h.ppn)}</span></div>`:''}
    <div class="row grand"><span>Total</span><span>${fmtRp(h.total)}</span></div>
    ${h.dp?`<div class="row"><span>${d.tipe==='kwitansi'?'Diterima':'Uang muka'}</span><span>−${fmtRp(h.dp)}</span></div>
           <div class="row" style="font-weight:650"><span>Sisa</span><span>${fmtRp(h.sisa)}</span></div>`:''}`;
}
document.addEventListener('change',function(e){
  const t=e.target;
  if(route==='jenis' && t.dataset && (t.dataset.jf==='bidangId'||t.dataset.jf==='tampil')){
    const j=JC().jenis.find(x=>x.id===jenisPilih); if(!j) return;
    if(t.dataset.jf==='tampil') j.sembunyi=!t.checked;
    else { j.bidangId=t.value; const c=JC(); c.jenis=c.jenis.filter(x=>x!==j); const akhir=c.jenis.map(x=>x.bidangId).lastIndexOf(j.bidangId); c.jenis.splice(akhir>=0?akhir+1:c.jenis.length,0,j); }
    save(); render(); return;
  }
  if(route==='jenis' && t.dataset && t.dataset.bd){ render(); return; }
  if(t.dataset && t.dataset.tahap!==undefined && t.dataset.tahap){
    const k=kerjaOf(kerjaId); if(!k) return;
    const th=(k.tahapan||[]).find(x=>x.id===t.dataset.tahap); if(!th) return;
    th.selesai=t.checked;
    if(th.ofaId) ofaState().centang[th.ofaId]={done:th.selesai, waktu:new Date().toISOString()};
    const pr=progresKerja(k);
    if(pr.total && pr.done===pr.total && AKTIF.indexOf(k.status)>=0){ k.status='selesai'; tandaiSelesai(k); jadwalkanGcal(k); }
    save(); render(); return;
  }
  if(route==='kerja' && t.dataset && t.dataset.kf && t.tagName==='SELECT'){
    const k=kerjaOf(kerjaId); if(!k) return;
    k[t.dataset.kf]=t.value;
    if(t.dataset.kf==='status') tandaiSelesai(k);
    save(); render();
    if(t.dataset.kf==='status'||t.dataset.kf==='klienId'||t.dataset.kf==='jenis') jadwalkanGcal(k);
    return;
  }
  if(route==='editor' && t.dataset && (t.dataset.f==='status'||t.dataset.f==='klienId')){
    const d=docOf(editId); if(!d) return;
    d[t.dataset.f]=t.value; save();
    const s=statusInfo(d);
    document.getElementById('pageSub').innerHTML =
      `<span style="font-family:var(--mono);font-size:12px">${esc(d.nomor)}</span> · <span class="pill ${s.warna}" style="vertical-align:1px">${s.label}</span>`;
    renderSheet(d);
  }
});
/* rapikan tampilan angka saat selesai mengetik */
document.addEventListener('blur',function(e){
  const t=e.target; if(!t||!t.dataset) return;
  const grp = new Intl.NumberFormat('id-ID');
  if(t.dataset.k==='harga'||t.dataset.f==='dp'||t.dataset.kf==='nilai'||t.dataset.kf==='tarifJam'||t.dataset.kf==='biaya'||t.dataset.p==='tarifJam'||t.dataset.jf==='tarif'){ t.value = grp.format(digits(t.value)); }
  else if(t.dataset.k==='qty'||t.dataset.f==='diskonPersen'||t.dataset.f==='ppnPersen'){ t.value = fmtNum(num(t.value)); }
  else if(t.dataset.kf==='estimasiJam'||t.dataset.kf==='revisiJatah'){ t.value = fmtNum(num(t.value)); }
  else if(t.dataset.p==='tempoHari'||t.dataset.p==='ppn'||t.dataset.p==='jamTarget'){ t.value = fmtNum(num(t.value)); }
},true);

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ closeModal(); return; }
  if(e.key==='Enter' && e.target && e.target.id==='jNama'){ e.preventDefault(); const b=document.querySelector('[data-act="jGantiNama"]'); if(b) b.click(); return; }
  if(e.key==='Enter' && e.target && e.target.dataset && e.target.dataset.bd){ e.preventDefault(); e.target.blur(); render(); return; }
  if(e.key==='Enter' && e.target && e.target.id==='tahapBaru'){
    e.preventDefault();
    const k=kerjaOf(kerjaId), nm=e.target.value.trim();
    if(!k||!nm) return;
    k.tahapan.push({id:uid(),nama:nm,selesai:false}); save(); render();
    const n=document.getElementById('tahapBaru'); if(n) n.focus();
  }
});

/* =======================================================
   16. Jalan
   ======================================================= */
load();
try{ tandaiPerubahan(true); }catch(e){}
if(!location.hash) location.hash='#beranda';
try{ if(tarikDariOfa()) save(); else kirimKeOfa(); }catch(e){}
try{ perbaruiStatusSink(); if(sinkAktif()) sinkron(); }catch(e){}
/* pasang sebagai aplikasi (hanya di situs GitHub Pages, bukan di dalam Claude) */
if('serviceWorker' in navigator && /github\.io$/.test(location.hostname)){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
render();
})();
</script>
